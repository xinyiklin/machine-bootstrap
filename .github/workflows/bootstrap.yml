name: Bootstrap verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run disposable workspace and project bootstrap tests
        # Linux and macOS runners ship Python 3.11+, so the generated Codex TOML
        # is also parsed by a real tomllib there instead of being skipped.
        env:
          MACHINE_BOOTSTRAP_TOML_PYTHON: ${{ runner.os != 'Windows' && 'python3' || '' }}
        run: node scripts/test-bootstrap.mjs
